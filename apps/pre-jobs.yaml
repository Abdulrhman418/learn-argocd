apiVersion: batch/v1
kind: Job
metadata:
  name: myjob-1
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
    argocd.argoproj.io/sync-wave: "1"
spec:
  template:
    spec:
      containers:
      - name: busybox-job
        image: busybox
        command: ["sh", "-c", "echo Job 1 starting; sleep 30; echo Job 1 done"]
      restartPolicy: Never
---
