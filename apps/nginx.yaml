apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: dev
  annotations:
    argocd.argoproj.io/hook: syn
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
  namespace: dev
  annotations:
    argocd.argoproj.io/hook: syn
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app: nginx
  ports:
  - port: 8080
    targetPort: 80
    nodePort: 8080
