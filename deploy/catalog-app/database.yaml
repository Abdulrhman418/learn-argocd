apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: catalog-app-database-data
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-app-database
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-app-database
  template:
    metadata:
      labels:
        app: catalog-app-database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: catalog-app-db
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: catalog-app-db
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-app-db
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: database-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: database-data
          persistentVolumeClaim:
            claimName: catalog-app-database-data
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-app-database
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector:
    app: catalog-app-database
  ports:
    - port: 5432
      targetPort: 5432
