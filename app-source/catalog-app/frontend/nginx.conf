server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://catalog-app-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /readyz {
        access_log off;
        return 200 "ready\n";
        add_header Content-Type text/plain;
    }
}
