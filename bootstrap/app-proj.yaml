---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dev
  namespace: argocd
spec:
  description: this is for dev env
  sourceRepos:
    - https://github.com/Abdulrhman418/learn-argocd.git
    
  destinations:
    - namespace: dev
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '' 
      kind: Namespace 

---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: prod
  namespace: argocd
spec:
  description: this is for production env 
  sourceRepos:
    - https://github.com/Abdulrhman418/learn-argocd.git

  destinations:
    - namespace: prod
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '' 
      kind: Namespace 
